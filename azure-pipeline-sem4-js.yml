trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'Sem4-Grp4'
  location: 'northcentralus'
  resourceGroupName: 'Sem4-Gpo4-JS'
  acrName: 'acrsem4js'                    # Debe ser único en minúsculas y números

  # Redes y Seguridad
  virtualNetworkName: 'VNet-Sem4-JS'
  subnetName: 'Subnet-Sem4-JS'
  addressPrefix: '10.0.0.0/16'
  subnetPrefix: '10.0.1.0/24'
  securityGroupName: 'NSG-Sem4-JS'
  publicIpName: 'PublicIP-Sem4-JS'

  # Máquina Virtual
  vmName: 'VM-Sem4-JS'
  vmSize: 'Standard_B2ats_v2'
  adminUsername: 'azureuser'

  imagePublisher: 'Canonical'
  imageOffer: 'ubuntu-24_04-lts'
  imageSku: 'server'
  imageVersion: 'latest'

stages:
- stage: DeployInfrastructure
  displayName: 'Despliegue de ACR, VM y Contenedores'
  jobs:
  - deployment: DeployVM
    displayName: 'Aprovisionamiento y Configuración de Contenedores'
    environment: 'Sem4-Gpo4-JS-Env'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Aprovisionar ACR, Red, VM y Docker'
            env:
              SECURE_ADMIN_PASSWORD: $(VM_ADMIN_PASSWORD)
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                echo "=== 1. Validando Grupo de Recursos ==="
                az group create --name $(resourceGroupName) --location "$(location)"

                echo "=== 2. Creando Azure Container Registry (ACR) ==="
                az acr create --resource-group $(resourceGroupName) --name $(acrName) --sku Basic --admin-enabled true

                echo "=== 3. Creando Red Virtual, Subnet y NSG ==="
                az network vnet create --resource-group $(resourceGroupName) --name $(virtualNetworkName) --address-prefix $(addressPrefix) --subnet-name $(subnetName) --subnet-prefix $(subnetPrefix)
                az network nsg create --resource-group $(resourceGroupName) --name $(securityGroupName)

                # Reglas SSH y HTTP
                az network nsg rule create --resource-group $(resourceGroupName) --nsg-name $(securityGroupName) --name AllowSSH --protocol Tcp --direction Inbound --priority 1000 --source-address-prefix '*' --source-port-range '*' --destination-address-prefix '*' --destination-port-range 22 --access Allow
                az network nsg rule create --resource-group $(resourceGroupName) --nsg-name $(securityGroupName) --name AllowHTTP --protocol Tcp --direction Inbound --priority 1001 --source-address-prefix '*' --source-port-range '*' --destination-address-prefix '*' --destination-port-range 80 --access Allow

                az network vnet subnet update --resource-group $(resourceGroupName) --vnet-name $(virtualNetworkName) --name $(subnetName) --network-security-group $(securityGroupName)

                echo "=== 4. Creando IP Pública ==="
                az network public-ip create --resource-group $(resourceGroupName) --name $(publicIpName) --sku Standard --allocation-method Static

                echo "=== 5. Preparando cloud-init para Docker y Contenedor ==="
                cat << 'EOF' > cloud-init.txt
                #cloud-config
                package_upgrade: true
                packages:
                  - docker.io
                runcmd:
                  - systemctl enable docker
                  - systemctl start docker
                  - usermod -aG docker azureuser
                  # Ejecución de la app dentro de un contenedor aislado mapeado al puerto 80
                  - docker run -d --restart always -p 80:80 --name web-container nginxdemos/hello
                EOF

                echo "=== 6. Creando Máquina Virtual con Docker ==="
                az vm create \
                  --resource-group $(resourceGroupName) \
                  --name $(vmName) \
                  --image "$(imagePublisher):$(imageOffer):$(imageSku):$(imageVersion)" \
                  --size $(vmSize) \
                  --admin-username $(adminUsername) \
                  --admin-password "$SECURE_ADMIN_PASSWORD" \
                  --vnet-name $(virtualNetworkName) \
                  --subnet $(subnetName) \
                  --nsg $(securityGroupName) \
                  --public-ip-address $(publicIpName) \
                  --custom-data cloud-init.txt

                IP_PUBLICA=$(az network public-ip show --resource-group $(resourceGroupName) --name $(publicIpName) --query ipAddress --output tsv)

                echo "========================================================="
                echo "¡Despliegue con Contenedor finalizado con éxito!"
                echo "ACR Creado: $(acrName).azurecr.io"
                echo "Web en contenedor: http://${IP_PUBLICA}"
                echo "========================================================="
